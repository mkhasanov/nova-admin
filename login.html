<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NovaAdmin Login</title>
    <meta name="description" content="NovaAdmin demo login screen" />
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="login-page-shell">
    <div class="login-screen">
      <div class="login-card">
        <div class="login-brand">
          <img src="assets/logo.svg" alt="NovaAdmin logo" />
          <div>
            <h1>NovaAdmin</h1>
            <p>Business command center</p>
          </div>
        </div>

        <div class="login-header">
          <span class="eyebrow">Secure access</span>
          <h2>Welcome back</h2>
        </div>

        <form id="login-form" class="login-form" novalidate>
          <div class="field-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="admin@example.com" required />
            <small class="error-text"></small>
          </div>

          <div class="field-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="••••••••" required />
            <small class="error-text"></small>
          </div>

          <div class="login-options">
            <label class="checkbox-wrap">
              <input type="checkbox" checked />
              <span>Remember me</span>
            </label>
            <a href="#">Forgot password?</a>
          </div>

          <button type="submit" class="button primary large width-full">Sign in</button>
          <p class="demo-note">Demo authentication only. Use the credentials below.</p>
          <div class="demo-credentials">
            <span>Email: admin@example.com</span>
            <span>Password: admin123</span>
          </div>
        </form>
      </div>
    </div>

    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="js/data.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
